name: CI

on:
  push:
  pull_request:

jobs:
  pruefungen:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, fileinfo, mbstring

      - name: PHP-Lint über alle Dateien
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Testsuite ausführen
        run: php tests/run.php

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS-Syntaxcheck
        run: node --check assets/js/admin.js
